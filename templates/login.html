{% extends "base.html" %}

{% block title %}Sign In — BharatLink Nexus AI{% endblock %}

{% block content %}
<div style="max-width: 28rem; margin: 3rem auto;">
  <div class="glass-card-amber">
    <h2 style="font-size: 2rem; color: #ffffff; margin-bottom: 0.5rem; text-align: center;">Sign In</h2>
    <p style="color: var(--text-muted); text-align: center; margin-bottom: 2rem;">Sign in as Buyer or Admin to access Procurement Platform</p>

    {% if error %}
    <div style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #fca5a5; padding: 0.75rem; border-radius: 0.5rem; margin-bottom: 1.5rem; font-size: 0.9rem;">
      {{ error }}
    </div>
    {% endif %}

    <!-- Quick Demo Accounts Banner -->
    <div style="background: rgba(245, 158, 11, 0.08); border: 1px solid var(--border-amber); border-radius: 0.5rem; padding: 0.75rem 1rem; margin-bottom: 1.5rem;">
      <div style="color: var(--amber-gold); font-size: 0.8rem; font-weight: bold; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em;">⚡ Demo Accounts (Click to Fill)</div>
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" onclick="fillCredentials('buyer@bharatlink.com', 'Buyer@12345')" style="flex: 1; background: rgba(9, 15, 33, 0.8); border: 1px solid var(--border-amber); color: #ffffff; padding: 0.45rem 0.5rem; border-radius: 0.375rem; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='rgba(245,158,11,0.2)'" onmouseout="this.style.background='rgba(9,15,33,0.8)'">👤 Buyer Demo</button>
        <button type="button" onclick="fillCredentials('admin@bharatlink.com', 'BharatLink@Admin2026#Sec')" style="flex: 1; background: rgba(9, 15, 33, 0.8); border: 1px solid var(--border-amber); color: #ffffff; padding: 0.45rem 0.5rem; border-radius: 0.375rem; font-size: 0.8rem; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='rgba(245,158,11,0.2)'" onmouseout="this.style.background='rgba(9,15,33,0.8)'">🛡️ Admin Demo</button>
      </div>
    </div>

    <form action="/login" method="POST" id="loginForm">
      <div style="margin-bottom: 1.25rem;">
        <label style="display: block; color: var(--amber-gold); font-weight: bold; margin-bottom: 0.5rem;">Email Address</label>
        <input type="email" id="emailInput" name="email" required placeholder="your.email@example.com" style="width: 100%; background: rgba(9, 15, 33, 0.8); border: 1px solid var(--border-amber); padding: 0.75rem; border-radius: 0.5rem; color: #ffffff;">
      </div>

      <div style="margin-bottom: 2rem;">
        <label style="display: block; color: var(--amber-gold); font-weight: bold; margin-bottom: 0.5rem;">Password</label>
        <input type="password" id="passwordInput" name="password" required placeholder="••••••••" style="width: 100%; background: rgba(9, 15, 33, 0.8); border: 1px solid var(--border-amber); padding: 0.75rem; border-radius: 0.5rem; color: #ffffff;">
      </div>

      <button type="submit" class="btn-amber" style="width: 100%; padding: 0.85rem; font-size: 1.1rem;">Sign In →</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.95rem; color: var(--text-muted);">
      Don't have an account? <a href="/signup" style="color: var(--amber-gold); font-weight: bold;">Create Account</a>
    </div>
  </div>
</div>

<script>
function fillCredentials(email, password) {
  const emailEl = document.getElementById('emailInput');
  const passEl = document.getElementById('passwordInput');
  if (emailEl && passEl) {
    emailEl.value = email;
    passEl.value = password;
    emailEl.focus();
  }
}
</script>
{% endblock %}
